name: Manifest

on:
  workflow_call:

jobs:
  compile:
    strategy:
      matrix:
        variant: [minimal]
        architecture: [x86_64, aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install
        run: |
          sudo apt-get install -qy podman
      - name: Pull
        run: |
          podman pull ghcr.io/osbuild/otk:latest
      - name: Compile
        run: |
          podman run  -v .:/app ghcr.io/osbuild/otk:latest validate -e environments/${{ matrix.architecture }}.yaml variants/${{ matrix.variant }}.yaml
